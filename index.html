<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Monkey Ball Gyro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: #FFD700;
            border: 4px solid #FFA500;
            border-radius: 50px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b37400;
            transition: transform 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b37400;
        }
        .stats {
            color: white;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
        }
        #timer {
            font-size: 2rem;
            color: #FFD700;
        }
        #message {
            font-size: 2rem;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "cannon-es": "https://esm.sh/cannon-es@0.20.0"
            }
        }
    </script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div class="stats">Level: <span id="level-display">1</span></div>
        <div class="stats" id="timer">60.00</div>
    </div>
    
    <div id="overlay">
        <div id="message">Ready to Roll?</div>
        <button id="start-btn">START GAME</button>
        <div style="color: #ccc; margin-top: 15px; font-size: 0.9rem;">Tilt your device to move!</div>
    </div>

    <script type="module" src="./js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
